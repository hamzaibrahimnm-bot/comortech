<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin — ComoreTech</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: #ffffff;
      min-height: 100vh;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       CONNEXION
    ========================= */

    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #111c2e;
      border: 1px solid #243550;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    .logo-text {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-text h1 {
      color: #20c9ff;
      font-size: 30px;
      margin-bottom: 6px;
    }

    .logo-text p {
      color: #9aa9bd;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #dce6f3;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 13px;
      border: 1px solid #30435f;
      border-radius: 10px;
      background: #0b1525;
      color: white;
      outline: none;
    }

    .form-group input:focus {
      border-color: #20c9ff;
    }

    .login-btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 13px;
      background: #20c9ff;
      color: #06101c;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-btn:hover {
      opacity: 0.9;
    }

    .forgot-btn {
      display: block;
      width: 100%;
      margin-top: 15px;
      border: none;
      background: transparent;
      color: #20c9ff;
      cursor: pointer;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .message.success {
      display: block;
      background: #12351f;
      color: #79e29b;
    }

    .message.error {
      display: block;
      background: #3a1515;
      color: #ff9b9b;
    }

    /* =========================
       DASHBOARD
    ========================= */

    .dashboard {
      min-height: 100vh;
    }

    .topbar {
      background: #111c2e;
      border-bottom: 1px solid #243550;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar h1 {
      color: #20c9ff;
      font-size: 23px;
    }

    .topbar p {
      color: #91a2b9;
      font-size: 12px;
      margin-top: 4px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      border: 1px solid #30435f;
      background: #17253a;
      color: white;
      border-radius: 9px;
      padding: 9px 12px;
      cursor: pointer;
    }

    .action-btn:hover {
      border-color: #20c9ff;
    }

    .logout-btn {
      background: #35181d;
      border-color: #6a2b34;
    }

    .content {
      max-width: 1200px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: #111c2e;
      border: 1px solid #243550;
      border-radius: 14px;
      padding: 18px;
    }

    .stat-card span {
      color: #8fa1b8;
      font-size: 13px;
    }

    .stat-card strong {
      display: block;
      font-size: 27px;
      margin-top: 8px;
      color: #ffffff;
    }

    .toolbar {
      background: #111c2e;
      border: 1px solid #243550;
      padding: 15px;
      border-radius: 14px;
      margin-bottom: 20px;
    }

    .search {
      width: 100%;
      padding: 13px;
      border: 1px solid #30435f;
      border-radius: 10px;
      background: #0b1525;
      color: white;
      outline: none;
    }

    .orders {
      display: grid;
      gap: 16px;
    }

    .order-card {
      background: #111c2e;
      border: 1px solid #243550;
      border-radius: 15px;
      padding: 20px;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 18px;
    }

    .reference {
      color: #20c9ff;
      font-weight: bold;
      font-size: 17px;
    }

    .date-created {
      color: #8293aa;
      font-size: 12px;
      margin-top: 5px;
    }

    .status-select {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #30435f;
      background: #0b1525;
      color: white;
      cursor: pointer;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .info {
      background: #0c1626;
      border-radius: 10px;
      padding: 12px;
    }

    .info small {
      display: block;
      color: #7e91a9;
      margin-bottom: 5px;
      font-size: 11px;
    }

    .info strong {
      color: #e7eef7;
      word-break: break-word;
      font-size: 14px;
    }

    .description {
      margin-top: 12px;
      background: #0c1626;
      border-radius: 10px;
      padding: 13px;
    }

    .description small {
      display: block;
      color: #7e91a9;
      margin-bottom: 7px;
    }

    .description p {
      color: #d7e1ed;
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 14px;
    }

    .contact-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .contact-btn {
      flex: 1;
      text-align: center;
      text-decoration: none;
      padding: 11px;
      border-radius: 9px;
      border: 1px solid #30435f;
      color: white;
      background: #17253a;
      font-size: 14px;
    }

    .contact-btn:hover {
      border-color: #20c9ff;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      background: #111c2e;
      border: 1px solid #243550;
      border-radius: 14px;
      color: #93a4ba;
    }

    .loading {
      text-align: center;
      padding: 35px;
      color: #20c9ff;
    }

    /* =========================
       MOT DE PASSE
    ========================= */

    .recovery-box {
      max-width: 420px;
      margin: 50px auto;
      padding: 25px;
      background: #111c2e;
      border: 1px solid #243550;
      border-radius: 15px;
    }

    .recovery-box h2 {
      margin-bottom: 10px;
      color: #20c9ff;
    }

    .recovery-box p {
      color: #96a7bc;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 750px) {

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .top-actions {
        width: 100%;
      }

      .top-actions button {
        flex: 1;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .order-header {
        flex-direction: column;
      }

      .status-select {
        width: 100%;
      }

      .contact-buttons {
        flex-direction: column;
      }
    }

    @media (max-width: 430px) {

      .login-box {
        padding: 22px;
      }

      .content {
        padding: 18px 12px 40px;
      }

      .stats {
        gap: 8px;
      }

      .stat-card {
        padding: 14px;
      }

      .stat-card strong {
        font-size: 22px;
      }

      .order-card {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       CONNEXION
  ========================== -->

  <section id="loginSection" class="login-container">

    <div class="login-box">

      <div class="logo-text">
        <h1>ComoreTech</h1>
        <p>Administration</p>
      </div>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input
            type="email"
            id="email"
            placeholder="admin@email.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
          >
        </div>

        <button class="login-btn" type="submit">
          Se connecter
        </button>

      </form>

      <button
        class="forgot-btn"
        type="button"
        onclick="forgotPassword()"
      >
        Mot de passe oublié ?
      </button>

      <div id="loginMessage" class="message"></div>

    </div>

  </section>


  <!-- =========================
       RECUPERATION MOT DE PASSE
  ========================== -->

  <section id="recoverySection" class="hidden">

    <div class="recovery-box">

      <h2>Nouveau mot de passe</h2>

      <p>
        Entre ton nouveau mot de passe pour sécuriser ton compte
        administrateur.
      </p>

      <div class="form-group">

        <label for="newPassword">
          Nouveau mot de passe
        </label>

        <input
          type="password"
          id="newPassword"
          placeholder="Nouveau mot de passe"
        >

      </div>

      <div class="form-group">

        <label for="confirmPassword">
          Confirmer le mot de passe
        </label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirmer le mot de passe"
        >

      </div>

      <button
        class="login-btn"
        onclick="updatePassword()"
      >
        Modifier le mot de passe
      </button>

      <div id="recoveryMessage" class="message"></div>

    </div>

  </section>


  <!-- =========================
       DASHBOARD
  ========================== -->

  <section id="dashboardSection" class="dashboard hidden">

    <header class="topbar">

      <div>
        <h1>ComoreTech — Admin</h1>
        <p>Gestion des commandes</p>
      </div>

      <div class="top-actions">

        <button
          class="action-btn"
          onclick="loadOrders()"
        >
          🔄 Actualiser
        </button>

        <button
          class="action-btn logout-btn"
          onclick="logout()"
        >
          🚪 Déconnexion
        </button>

      </div>

    </header>


    <main class="content">

      <!-- STATISTIQUES -->

      <div class="stats">

        <div class="stat-card">
          <span>Total</span>
          <strong id="totalCount">0</strong>
        </div>

        <div class="stat-card">
          <span>Nouvelles</span>
          <strong id="newCount">0</strong>
        </div>

        <div class="stat-card">
          <span>En cours</span>
          <strong id="progressCount">0</strong>
        </div>

        <div class="stat-card">
          <span>Terminées</span>
          <strong id="doneCount">0</strong>
        </div>

      </div>


      <!-- RECHERCHE -->

      <div class="toolbar">

        <input
          type="search"
          id="searchInput"
          class="search"
          placeholder="🔎 Rechercher une commande, un nom, un e-mail..."
        >

      </div>


      <!-- COMMANDES -->

      <div id="ordersContainer" class="orders">

        <div class="loading">
          Chargement des commandes...
        </div>

      </div>

    </main>

  </section>


  <script>

    /* ==========================================
       SUPABASE
    ========================================== */

    const SUPABASE_URL =
      "https://wevngkvljcctclilbnim.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Hu_ehmjppmxnDCn-7wbeTA_oCcyrdCV";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    let allOrders = [];


    /* ==========================================
       ELEMENTS
    ========================================== */

    const loginSection =
      document.getElementById("loginSection");

    const dashboardSection =
      document.getElementById("dashboardSection");

    const recoverySection =
      document.getElementById("recoverySection");


    /* ==========================================
       UTILITAIRE
    ========================================== */

    function escapeHTML(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function escapeAttr(value) {

      return escapeHTML(value)
        .replace(/`/g, "&#096;");

    }


    /* ==========================================
       MESSAGE CONNEXION
    ========================================== */

    function showLoginMessage(text, type) {

      const box =
        document.getElementById("loginMessage");

      box.textContent = text;

      box.className = "message";

      if (type) {
        box.classList.add(type);
      }

    }


    /* ==========================================
       CONNEXION
    ========================================== */

    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        showLoginMessage(
          "Connexion...",
          ""
        );

        const { data, error } =
          await client.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {

          showLoginMessage(
            "❌ " + error.message,
            "error"
          );

          return;
        }

        showLoginMessage(
          "✅ Connexion réussie.",
          "success"
        );

        setTimeout(() => {
          showDashboard();
        }, 300);

      });


    /* ==========================================
       AFFICHER DASHBOARD
    ========================================== */

    async function showDashboard() {

      loginSection.classList.add("hidden");

      recoverySection.classList.add("hidden");

      dashboardSection.classList.remove("hidden");

      await loadOrders();

    }


    /* ==========================================
       VERIFIER SESSION
    ========================================== */

    async function checkSession() {

      const {
        data: { session }
      } = await client.auth.getSession();

      if (session) {

        showDashboard();

      } else {

        loginSection.classList.remove("hidden");

        dashboardSection.classList.add("hidden");

      }

    }


    /* ==========================================
       CHARGER COMMANDES
    ========================================== */

    async function loadOrders() {

      const container =
        document.getElementById("ordersContainer");

      container.innerHTML =
        '<div class="loading">🔄 Chargement...</div>';


      const {
        data: { user }
      } = await client.auth.getUser();


      if (!user) {

        showLogin();

        return;

      }


      const { data, error } =
        await client
          .from("commandes")
          .select("*")
          .order("created_at", {
            ascending: false
          });


      if (error) {

        container.innerHTML =
          '<div class="empty">❌ Erreur : ' +
          escapeHTML(error.message) +
          '</div>';

        return;

      }


      allOrders = data || [];

      updateStats();

      renderOrders();

    }


    /* ==========================================
       STATISTIQUES
    ========================================== */

    function updateStats() {

      const total =
        allOrders.length;

      const nouvelles =
        allOrders.filter(
          order => order.statut === "Nouvelle"
        ).length;

      const enCours =
        allOrders.filter(
          order => order.statut === "En cours"
        ).length;

      const terminees =
        allOrders.filter(
          order => order.statut === "Terminée"
        ).length;


      document.getElementById("totalCount")
        .textContent = total;

      document.getElementById("newCount")
        .textContent = nouvelles;

      document.getElementById("progressCount")
        .textContent = enCours;

      document.getElementById("doneCount")
        .textContent = terminees;

    }


    /* ==========================================
       RECHERCHE
    ========================================== */

    document
      .getElementById("searchInput")
      .addEventListener("input", renderOrders);


    /* ==========================================
       AFFICHER COMMANDES
    ========================================== */

    function renderOrders() {

      const container =
        document.getElementById("ordersContainer");

      const search =
        document
          .getElementById("searchInput")
          .value
          .toLowerCase()
          .trim();


      const filtered =
        allOrders.filter(order => {

          const text = [

            order.reference,
            order.service,
            order.nom,
            order.whatsapp,
            order.email,
            order.description,
            order.statut

          ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


          return text.includes(search);

        });


      if (filtered.length === 0) {

        container.innerHTML =
          '<div class="empty">Aucune commande trouvée.</div>';

        return;

      }


      container.innerHTML =
        filtered.map(order => {

          const whatsapp =
            String(order.whatsapp || "")
              .replace(/[^0-9]/g, "");


          const created =
            order.created_at
              ? new Date(order.created_at)
                  .toLocaleString("fr-FR")
              : "";


          return `

            <article class="order-card">

              <div class="order-header">

                <div>

                  <div class="reference">
                    ${escapeHTML(order.reference || "Sans référence")}
                  </div>

                  <div class="date-created">
                    Reçue le ${escapeHTML(created)}
                  </div>

                </div>


                <select
                  class="status-select"
                  onchange="updateStatus(
                    '${escapeAttr(order.id)}',
                    this.value
                  )"
                >

                  <option
                    value="Nouvelle"
                    ${order.statut === "Nouvelle" ? "selected" : ""}
                  >
                    Nouvelle
                  </option>

                  <option
                    value="En cours"
                    ${order.statut === "En cours" ? "selected" : ""}
                  >
                    En cours
                  </option>

                  <option
                    value="Terminée"
                    ${order.statut === "Terminée" ? "selected" : ""}
                  >
                    Terminée
                  </option>

                  <option
                    value="Annulée"
