<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ComoreTech — Administration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: #ffffff;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #0d1b2a;
      border: 1px solid #21344a;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
    }

    h1,
    h2 {
      margin-top: 0;
    }

    .description {
      color: #9fb0c2;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #30465e;
      background: #081421;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #18a66a;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 18px;
      margin-top: 15px;
      background: #18a66a;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .logout {
      background: #24384e;
    }

    .hidden {
      display: none;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .message {
      margin-top: 15px;
    }

    .error {
      color: #ff8585;
    }

    .success {
      color: #6ee7b7;
    }

    .order {
      background: #091624;
      border: 1px solid #263d55;
      border-radius: 14px;
      padding: 17px;
      margin-top: 15px;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .reference {
      font-size: 17px;
      font-weight: bold;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 50px;
      background: #183a31;
      color: #6ee7b7;
      font-size: 13px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 15px;
    }

    .info {
      background: #0d1b2a;
      border-radius: 10px;
      padding: 12px;
    }

    .info strong {
      display: block;
      margin-bottom: 5px;
    }

    .muted {
      color: #9fb0c2;
    }

    .search {
      margin-top: 10px;
    }

    @media (max-width: 650px) {
      .container {
        padding: 12px;
      }

      .card {
        padding: 17px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .top {
        align-items: flex-start;
      }

      .logout {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- CONNEXION -->
    <section id="loginCard" class="card">

      <h1>ComoreTech Admin</h1>

      <p class="description">
        Connecte-toi avec ton compte administrateur pour consulter
        les commandes reçues sur ComoreTech.
      </p>

      <label for="email">Adresse e-mail</label>

      <input
        type="email"
        id="email"
        placeholder="Ton adresse e-mail"
        autocomplete="username"
      >

      <label for="password">Mot de passe</label>

      <input
        type="password"
        id="password"
        placeholder="Ton mot de passe"
        autocomplete="current-password"
      >

      <button id="loginBtn">
        Se connecter
      </button>

      <div id="loginMessage" class="message"></div>

    </section>


    <!-- TABLEAU DE BORD -->
    <section id="dashboard" class="hidden">

      <div class="card">

        <div class="top">

          <div>
            <h1>Tableau de bord</h1>

            <p id="userInfo" class="muted"></p>
          </div>

          <button id="logoutBtn" class="logout">
            Se déconnecter
          </button>

        </div>

      </div>


      <!-- COMMANDES -->
      <div class="card">

        <h2>📋 Commandes reçues</h2>

        <p class="description">
          Voici les demandes envoyées depuis le site ComoreTech.
        </p>

        <input
          id="search"
          class="search"
          type="search"
          placeholder="🔎 Rechercher une commande..."
        >

        <div id="orders">
          <p class="muted">
            Chargement des commandes...
          </p>
        </div>

      </div>

    </section>

  </div>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =========================
       CONFIGURATION SUPABASE
    ========================= */

    const client = window.supabase.createClient(

      "https://wevngkvljcctclilbnim.supabase.co",

      "sb_publishable_Hu_ehmjppmxnDCn-7wbeTA_oCcyrdCV"

    );


    /* =========================
       VARIABLES
    ========================= */

    let allOrders = [];


    const loginCard =
      document.getElementById("loginCard");

    const dashboard =
      document.getElementById("dashboard");

    const loginMessage =
      document.getElementById("loginMessage");

    const ordersBox =
      document.getElementById("orders");


    /* =========================
       BOUTON CONNEXION
    ========================= */

    document
      .getElementById("loginBtn")
      .addEventListener("click", login);


    async function login() {

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;


      if (!email || !password) {

        loginMessage.className = "message error";

        loginMessage.textContent =
          "Veuillez remplir les deux champs.";

        return;
      }


      loginMessage.className =
        "message";

      loginMessage.textContent =
        "Connexion en cours...";


      const { error } =
        await client.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        loginMessage.className =
          "message error";

        loginMessage.textContent =
          "Connexion impossible : " +
          error.message;

        return;
      }


      await showDashboard();

    }


    /* =========================
       AFFICHER LE DASHBOARD
    ========================= */

    async function showDashboard() {

      const {
        data: {
          user
        }
      } = await client.auth.getUser();


      if (!user) {

        loginCard.classList.remove("hidden");

        dashboard.classList.add("hidden");

        return;
      }


      loginCard.classList.add("hidden");

      dashboard.classList.remove("hidden");


      document
        .getElementById("userInfo")
        .textContent =
        "Connecté : " + user.email;


      await loadOrders();

    }


    /* =========================
       CHARGER LES COMMANDES
    ========================= */

    async function loadOrders() {

      ordersBox.innerHTML =
        "<p class='muted'>Chargement...</p>";


      const {
        data,
        error
      } = await client

        .from("commandes")

        .select("*")

        .order(
          "created_at",
          {
            ascending: false
          }
        );


      if (error) {

        ordersBox.innerHTML =
          "<p class='error'>" +
          "Impossible de charger les commandes : " +
          escapeHtml(error.message) +
          "</p>";

        return;
      }


      allOrders = data || [];


      renderOrders();

    }


    /* =========================
       AFFICHER LES COMMANDES
    ========================= */

    function renderOrders() {

      const query =
        document
          .getElementById("search")
          .value
          .trim()
          .toLowerCase();


      const filtered =
        allOrders.filter(order =>

          String(order.reference || "")
            .toLowerCase()
            .includes(query)

          ||

          String(order.nom || "")
            .toLowerCase()
            .includes(query)

          ||

          String(order.service || "")
            .toLowerCase()
            .includes(query)

          ||

          String(order.whatsapp || "")
            .toLowerCase()
            .includes(query)

          ||

          String(order.email || "")
            .toLowerCase()
            .includes(query)

        );


      if (!filtered.length) {

        ordersBox.innerHTML =
          "<p class='muted'>" +
          "Aucune commande trouvée." +
          "</p>";

        return;
      }


      ordersBox.innerHTML =
        filtered.map(order => `

          <div class="order">

            <div class="order-header">

              <span class="reference">
                ${escapeHtml(
                  order.reference ||
                  "Sans référence"
                )}
              </span>

              <span class="status">
                ${escapeHtml(
                  order.statut ||
                  "Nouvelle"
                )}
              </span>

            </div>


            <div class="info-grid">

              <div class="info">

                <strong>Service</strong>

                ${escapeHtml(
                  order.service || ""
                )}

              </div>


              <div class="info">

                <strong>Nom</strong>

                ${escapeHtml(
                  order.nom || ""
                )}

              </div>


              <div class="info">

                <strong>WhatsApp</strong>

                ${escapeHtml(
                  order.whatsapp || ""
                )}

              </div>


              <div class="info">

                <strong>E-mail</strong>

                ${escapeHtml(
                  order.email || ""
                )}

              </div>


              <div class="info">

                <strong>Date souhaitée</strong>

                ${escapeHtml(
                  order.date_souhaitee || ""
                )}

              </div>


              <div class="info">

                <strong>Paiement</strong>

                ${escapeHtml(
                  order.paiement ||
                  "En attente"
                )}

              </div>

            </div>


            <div class="info" style="margin-top:12px">

              <strong>Description du projet</strong>

              ${escapeHtml(
                order.description ||
                "Aucune description"
              )}

            </div>


            <p class="muted">

              Commande reçue :
              ${formatDate(order.created_at)}

            </p>

          </div>

        `).join("");

    }


    /* =========================
       RECHERCHE
    ========================= */

    document
      .getElementById("search")
      .addEventListener(
        "input",
        renderOrders
      );


    /* =========================
       DECONNEXION
    ========================= */

    document
      .getElementById("logoutBtn")
      .addEventListener(
        "click",
        logout
      );


    async function logout() {

      await client.auth.signOut();


      dashboard
        .classList
        .add("hidden");


      loginCard
        .classList
        .remove("hidden");


      document
        .getElementById("password")
        .value = "";


      loginMessage.className =
        "message success";

      loginMessage.textContent =
        "Vous êtes déconnecté.";

    }


    /* =========================
       DATE
    ========================= */

    function formatDate(value) {

      if (!value) {
        return "";
      }


      const date =
        new Date(value);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return value;

      }


      return date.toLocaleString(
        "fr-FR"
      );

    }


    /* =========================
       SECURITE AFFICHAGE
    ========================= */

    function escapeHtml(value) {

      return String(value ?? "")

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* =========================
       VERIFIER SESSION
    ========================= */

    client.auth
      .getSession()
      .then(() => {

        showDashboard();

      });

  </script>

</body>
</html>
